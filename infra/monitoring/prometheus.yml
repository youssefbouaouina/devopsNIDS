global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: student-management
    metrics_path: /student/actuator/prometheus
    static_configs:
      - targets: ["localhost:8089"]
