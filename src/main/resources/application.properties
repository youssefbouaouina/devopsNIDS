spring.application.name=student-management
spring.datasource.url=jdbc:mysql://localhost:3306/studentdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Server configuration :
server.port=8089
server.servlet.context-path=/student

# Do not disclose error internals to clients (OWASP ZAP: Application Error Disclosure)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
server.server-header=

# API docs: patched Swagger UI webjar pinned in pom.xml (Retire.js remediation)
springdoc.swagger-ui.version=5.34.1

# Monitoring (scraped by Prometheus at /student/actuator/prometheus) :
management.endpoints.web.exposure.include=health,info,prometheus